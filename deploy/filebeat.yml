# Filebeat 配置（docker 化：随 docker compose 一起起，容器内采集）
#
# 日志目录由 docker-compose 挂载到容器内 /logs/tianyan、/logs/waf。
# 本文件挂到容器 /usr/share/filebeat/filebeat.yml。
#
# fields.source 标识来源，消费端据此映射到「天眼」/「WAF」并走对应解析规则；
# Filebeat 原生处理 offset 持久化(registry) / logrotate 轮转感知 / 文件删除容忍。

filebeat.inputs:
  - type: log
    enabled: true
    paths:
      - /logs/tianyan/*.log
    fields:
      source: tianyan
    fields_under_root: false

  - type: log
    enabled: true
    paths:
      - /logs/waf/*.log
    fields:
      source: waf
    fields_under_root: false

  - type: log
    enabled: true
    paths:
      - /logs/hids/*.log
    fields:
      source: hids
    fields_under_root: false

output.kafka:
  hosts: ["kafka:9092"]
  topic: soma-logs
  required_acks: 1
  compression: gzip
  max_message_bytes: 1000000

# 只发必要字段，减小消息体积（消费端只需 message + fields.source）
processors:
  - drop_fields:
      fields: ["agent", "ecs", "host", "input", "log.offset"]
      ignore_missing: true
