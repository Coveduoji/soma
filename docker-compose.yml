# 神经免疫 工作台 · 单机自托管部署
# 用法：
#   cp .env.example .env    # 填 NEUROIMMUNE_ADMIN_PASSWORD / NEUROIMMUNE_API_TOKEN 等
#   docker compose up -d --build
# 数据持久化在命名卷 neuroimmune-data（挂到 backend 的 /data）。

version: "3.8"   # 兼容老版 docker-compose v1（CentOS 7 默认只有 v1）；新版 v2 忽略此字段

services:
  backend:
    image: neuroimmune-backend:latest
    build:
      context: .
      dockerfile: backend/Dockerfile
      network: host   # 构建期用宿主网络（本机代理在 127.0.0.1:7890，容器内需直通宿主）
    environment:
      NEUROIMMUNE_DATA_DIR: /data
      NEUROIMMUNE_ADMIN_USER: ${NEUROIMMUNE_ADMIN_USER:-admin}
      NEUROIMMUNE_ADMIN_PASSWORD: ${NEUROIMMUNE_ADMIN_PASSWORD:-}
      NEUROIMMUNE_JWT_SECRET: ${NEUROIMMUNE_JWT_SECRET:-}
      NEUROIMMUNE_API_TOKEN: ${NEUROIMMUNE_API_TOKEN:-}
      NEUROIMMUNE_SYSLOG_BIND: ${NEUROIMMUNE_SYSLOG_BIND:-0.0.0.0}
      NEUROIMMUNE_SYSLOG_PORT: ${NEUROIMMUNE_SYSLOG_PORT:-5514}
      # Kafka 接入（日志云平台打日志到 Kafka，后端消费；留空则关闭 Kafka 通道）
      NEUROIMMUNE_KAFKA_BOOTSTRAP_SERVERS: ${NEUROIMMUNE_KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      NEUROIMMUNE_KAFKA_TOPIC: ${NEUROIMMUNE_KAFKA_TOPIC:-neuroimmune-logs}
      NEUROIMMUNE_KAFKA_GROUP: ${NEUROIMMUNE_KAFKA_GROUP:-neuroimmune}
      # 模型接入（可选，空 = mock 模式跑通架构）
      NEUROIMMUNE_API_KEY: ${NEUROIMMUNE_API_KEY:-}
      NEUROIMMUNE_BASE_URL: ${NEUROIMMUNE_BASE_URL:-}
      NEUROIMMUNE_MODEL: ${NEUROIMMUNE_MODEL:-}
      NEUROIMMUNE_DEEP_MODEL: ${NEUROIMMUNE_DEEP_MODEL:-}
      NEUROIMMUNE_LOG_LEVEL: ${NEUROIMMUNE_LOG_LEVEL:-INFO}
      # 真模型直连：容器内 127.0.0.1:7890 是容器自身回环，够不到宿主代理；DeepSeek 国内直连即可
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      ALL_PROXY: ""
      http_proxy: ""
      https_proxy: ""
      all_proxy: ""
      NO_PROXY: "*"
      no_proxy: "*"
    volumes:
      - neuroimmune-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    expose:
      - "8000"
    # syslog 接收：默认 0.0.0.0 对外收日志（仅本机收改回 127.0.0.1 并注释掉端口映射）
    ports:
      - "5514:5514/udp"
      - "5514:5514/tcp"

  kafka:
    image: apache/kafka:3.9.0
    environment:
      # KRaft 单节点（无需 ZooKeeper）
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      # 单 listener：容器内 backend 走 kafka:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
    ports:
      - "9092:9092"
    restart: unless-stopped

  filebeat:
    image: elastic/filebeat:8.15.0
    # 默认用户 uid=1000，与宿主日志文件/配置文件的属主一致（避免 SELinux/权限问题）
    volumes:
      - ./deploy/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro,z
      - ${TIANYAN_LOG_DIR:-/wls/applogs/rtlog/sec-terminal-linux/tianyanlog}:/logs/tianyan:ro,z
      - ${WAF_LOG_DIR:-/wls/applogs/rtlog/sec-terminal-linux/waflog}:/logs/waf:ro,z
      - ${HIDS_LOG_DIR:-/wls/applogs/rtlog/sec-terminal-linux/hidslog}:/logs/hids:ro,z
      - filebeat-data:/usr/share/filebeat/data   # registry offset 持久化
    depends_on:
      - kafka
    restart: unless-stopped

  nginx:
    image: neuroimmune-nginx:latest
    build:
      context: .
      dockerfile: frontend/Dockerfile
      network: host   # 构建期用宿主网络（同上）
    ports:
      - "80:80"
      # - "443:443"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  neuroimmune-data:
  filebeat-data:
