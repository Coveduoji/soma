# Soma 工作台 · 前端静态托管 + /api 反代
# 默认 HTTP(80)。上生产用 certbot 拿证书后，取消下方 443 server 块注释并挂载证书。

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 前端静态 + SPA fallback（BrowserRouter，回退到 index.html）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 反代到后端（服务名 backend 由 docker-compose 网络解析）
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 130s;   # 系统2 深析最长 120s
        client_max_body_size 50m;  # 告警文件上传
    }
}

